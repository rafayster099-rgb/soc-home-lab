title: Windows Brute Force Login Attempts
id: custom-t1110-001
status: test
description: Detects multiple failed login attempts from a single source within a short timeframe, indicating brute force
references:
    - https://attack.mitre.org/techniques/T1110/
author: Sasa
date: 2026/07/31
logsource:
    product: windows
    service: security
detection:
    selection:
        EventCode: 4625
    timeframe: 600s
    condition: selection | count(EventCode) by Source_Network_Address > 5
falsepositives:
    - Users who forgot their password
    - Vulnerability scanners
    - Legitimate application misconfiguration causing retries
level: medium
tags:
    - attack.credential_access
    - attack.t1110
